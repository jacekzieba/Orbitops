name: Publikacja OrbitOps

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Zainstaluj zależności
        run: npm ci
        working-directory: prototyp

      - name: Przygotuj pliki strony
        run: |
          mkdir -p _site/node_modules/three/examples/jsm/controls
          cp prototyp/*.html prototyp/*.css prototyp/*.js _site/
          cp -R prototyp/assets _site/assets
          cp -R prototyp/review _site/review
          cp -R prototyp/node_modules/three/build _site/node_modules/three/build
          cp prototyp/node_modules/three/examples/jsm/controls/OrbitControls.js _site/node_modules/three/examples/jsm/controls/
          cp prototyp/node_modules/three/LICENSE _site/node_modules/three/LICENSE
          touch _site/.nojekyll

      - name: Skonfiguruj Pages
        uses: actions/configure-pages@v5

      - name: Prześlij stronę
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Opublikuj
        id: deployment
        uses: actions/deploy-pages@v5
